<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TagTerm — 多标签终端会话管理（可交互原型）</title>
<style>
:root{
  --bg:#E9ECF0; --panel:#F6F7F9; --panel2:#FFFFFF; --line:#D3D8DF;
  --text:#1D2126; --muted:#68717D; --accent:#0A5FD1; --accent-soft:#E1ECFA;
  --t-bg:#0C0C0C; --t-fg:#CCCCCC; --t-dim:#767676; --t-green:#16C60C;
  --t-yellow:#F9F1A5; --t-red:#E74856; --t-cyan:#61D6D6; --t-blue:#3B78FF;
  --st-work:#16A34A; --st-block:#E0A400; --st-done:#2F6FDB; --st-idle:#9AA3AE;
  --font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"Microsoft YaHei","PingFang SC",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--font);color:var(--text);background:var(--bg);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{display:grid;grid-template-columns:296px 1fr;height:100vh;transition:grid-template-columns .15s}
.app.side-hidden{grid-template-columns:0 1fr}
.app.side-hidden .side{overflow:hidden;border:0}

/* ---------- 左侧：标签与会话 ---------- */
.side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-width:0}
.side-head{padding:12px 12px 8px}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.brand b{font-size:15px;font-weight:600}
.brand span{color:var(--muted);font-size:12px}
.search{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.filter{padding:4px 12px 10px;border-bottom:1px solid var(--line)}
.filter-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{padding:2px 9px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--text);color:#fff}
.link{color:var(--accent);font-size:12px;margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12.5px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip em{font-style:normal;color:var(--muted);font-size:11px}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 70%,#000)}
.chip.on em{color:inherit;opacity:.7}
.hint{font-size:12px;color:var(--muted);padding:2px 0}

.groups{flex:1;overflow:auto;padding:6px 6px 8px}
.group{margin-bottom:4px}
.group-h{display:flex;align-items:center;gap:6px;width:100%;padding:6px;font-size:12px;color:var(--muted);border-radius:6px;text-align:left}
.group-h:hover{background:#EDEFF3}
.group-h .tri{width:0;height:0;border:4px solid transparent;border-left-color:currentColor;margin:0 2px 0 3px;transition:transform .12s}
.group.open .group-h .tri{transform:rotate(90deg)}
.group-h i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.group-h b{font-weight:600;color:var(--text)}
.group-h em{font-style:normal;margin-left:auto}
.group-body{display:none}
.group.open .group-body{display:block}
.row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px 6px 22px;border-radius:6px;text-align:left;position:relative}
.row:hover,.row.peer{background:#E4E8ED}
.row.active,.row.active.peer{background:var(--accent-soft)}
.row.active::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.row .txt{min-width:0;flex:1}
.row .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .path{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.row .dots{display:flex;gap:3px;flex:none}
.row .dots i{width:6px;height:6px;border-radius:50%}
.none{padding:4px 22px;font-size:12px;color:var(--muted)}
.empty-side{padding:24px 12px;text-align:center;font-size:12.5px;color:var(--muted)}

.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--st-idle);background:transparent}
.dot.working{background:var(--st-work);border-color:var(--st-work)}
.dot.blocked{background:var(--st-block);border-color:var(--st-block);animation:pulse 1.2s infinite}
.dot.done{background:var(--st-done);border-color:var(--st-done)}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--st-block) 30%,transparent)}}
@media (prefers-reduced-motion:reduce){.dot.blocked{animation:none}}

.side-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px;white-space:nowrap}
.btn:hover{background:#F0F2F5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0953B5}
.btn.danger{color:#B42318}
.btn.danger:hover{background:#FCEBEA}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.mono{font-family:var(--mono)}

/* ---------- 右侧：标签页、路径条、终端 ---------- */
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 8px 0;height:44px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-radius:8px 8px 0 0;background:#DCE0E6;color:var(--muted);font-size:13px;max-width:200px;white-space:nowrap;cursor:default;flex:none}
.tab:hover{background:#D2D7DE}
.tab.active,.tab.active:hover{background:var(--t-bg);color:#fff}
.tab .x{opacity:.5;padding:0 4px;border-radius:4px;font-size:15px;line-height:1}
.tab .x:hover{opacity:1;background:rgba(0,0,0,.15)}
.tab.active .x:hover{background:rgba(255,255,255,.2)}
.tab-add,.tab-side{padding:6px 10px;color:var(--muted);font-size:15px;line-height:1;border-radius:6px;margin-bottom:3px;flex:none}
.tab-add:hover,.tab-side:hover{background:#DCE0E6;color:var(--text)}

.strip{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap}
.strip .path{font-family:var(--mono);font-size:13px;padding:3px 8px;background:var(--panel);border:1px solid var(--line);border-radius:5px;user-select:all}
.stag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 5px 2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 70%,#000);border:1px solid color-mix(in srgb,var(--c) 35%,#fff)}
.stag button{opacity:.55;font-size:13px;line-height:1;padding:0 2px}
.stag button:hover{opacity:1}
.launch{margin-left:auto;display:flex;gap:6px;align-items:center}
.launch .lab{font-size:12px;color:var(--muted);margin-right:2px}

.work{flex:1;display:flex;flex-direction:column;min-height:0}
.term{flex:1;background:var(--t-bg);color:var(--t-fg);font:13.5px/1.5 var(--mono);padding:8px 12px;overflow:auto;cursor:text;white-space:pre-wrap;word-break:break-all}
.term .l{min-height:1.5em}
.term .in{color:#fff}
.term .dim{color:var(--t-dim)}
.term .ok{color:var(--t-green)}
.term .err{color:var(--t-red)}
.term .warn{color:var(--t-yellow)}
.term .cy{color:var(--t-cyan)}
.term .bl{color:var(--t-blue)}
.term .cur{display:flex}
.term .cur input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;padding:0;caret-color:#fff;min-width:40px}

.status{display:flex;gap:16px;padding:4px 14px;font-size:12px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
.status .sp{margin-left:auto}
.status .k{display:inline-flex;align-items:center;gap:5px}

.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px;background:var(--t-bg);color:#9AA3AE}
.empty h2{margin:0 0 8px;font-size:18px;font-weight:600;color:#fff}
.empty p{margin:0 0 4px;font-size:13px}
.empty kbd{font-family:var(--mono);background:#1F2328;padding:1px 6px;border-radius:4px;color:#CCC}

/* ---------- 弹层 ---------- */
.backdrop{position:fixed;inset:0;background:rgba(20,24,30,.35);display:none;align-items:center;justify-content:center;z-index:20}
.backdrop.show{display:flex}
.modal{width:460px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:18px 20px}
.modal h3{margin:0 0 14px;font-size:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px}
.field input.mono{font-family:var(--mono)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.pop{position:absolute;z-index:15;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;width:230px;display:none}
.pop.show{display:block}
.pop .opt{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:5px;text-align:left;font-size:13px}
.pop .opt:hover{background:#F0F2F5}
.pop .opt i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pop .opt .ck{margin-left:auto;color:var(--accent);font-weight:600}
.pop input{width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--line);border-radius:5px}
.tagrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #EEF0F3}
.tagrow .sw{width:18px;height:18px;border-radius:5px;background:var(--c);flex:none}
.tagrow input{flex:1;padding:4px 8px;border:1px solid transparent;border-radius:5px;min-width:0}
.tagrow input:hover,.tagrow input:focus{border-color:var(--line)}
.tagrow em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 25% 0 0;z-index:10;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  .app.side-hidden .side{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand"><b>TagTerm</b><span>会话即路径，标签可交叉</span></div>
      <input class="search" id="search" type="search" placeholder="搜索会话名或路径　Ctrl+K" autocomplete="off">
    </div>
    <div class="filter">
      <div class="filter-row">
        <span>按标签筛选</span>
        <span class="seg"><button id="modeAny" class="on" title="含任一选中标签">任一</button><button id="modeAll" title="同时含所有选中标签">全部</button></span>
        <button class="link" id="clearFilter">清除</button>
      </div>
      <div class="chips" id="tagChips"></div>
    </div>
    <div class="groups" id="groups"></div>
    <div class="side-foot">
      <button class="btn primary" id="newSessionBtn">新建会话</button>
      <button class="btn" id="manageTagsBtn">管理标签</button>
    </div>
  </aside>

  <main class="main">
    <div class="tabs" id="tabs"></div>
    <div class="work" id="work">
      <div class="strip" id="strip"></div>
      <div class="term" id="term">
        <div id="termLines"></div>
        <div class="cur"><span id="promptTxt"></span><input id="termInput" spellcheck="false" autocomplete="off"></div>
      </div>
    </div>
    <div class="empty" id="empty">
      <div>
        <h2>选一个会话开始</h2>
        <p>左侧每一行都是一个固定路径的 cmd，一个会话可以同时挂在多个标签下。</p>
        <p>点击行即打开，终端里输入 <kbd>claude</kbd>、<kbd>gemini</kbd> 或 <kbd>codex</kbd> 唤起对应工具。</p>
      </div>
    </div>
    <div class="status" id="status"></div>
  </main>
</div>

<!-- 给会话加标签的弹出层 -->
<div class="pop" id="tagPop"></div>

<!-- 新建会话 -->
<div class="backdrop" id="newModal">
  <div class="modal">
    <h3>新建会话</h3>
    <div class="field"><label for="nsName">名称</label><input id="nsName" placeholder="例如 simba-api"></div>
    <div class="field"><label for="nsPath">目录</label><input id="nsPath" class="mono" placeholder="D:\Projects\..."></div>
    <div class="field"><label>标签（可多选）</label><div class="chips" id="nsChips"></div>
      <input id="nsNewTag" style="margin-top:8px" placeholder="新标签名，回车添加"></div>
    <div class="actions"><button class="btn" id="nsCancel">取消</button><button class="btn primary" id="nsCreate">创建并打开</button></div>
  </div>
</div>

<!-- 管理标签 -->
<div class="backdrop" id="tagsModal">
  <div class="modal">
    <h3>管理标签</h3>
    <div id="tagRows"></div>
    <div class="field" style="margin-top:12px"><input id="mtNewTag" placeholder="新标签名，回车添加"></div>
    <div class="actions"><button class="btn primary" id="mtClose">完成</button></div>
  </div>
</div>

<script>
/* ---------- 数据 ---------- */
const TAG_COLORS=['#2F6FDB','#2A9D5C','#C98A0C','#7B4FD1','#D14343','#1E9BA8','#C8449A','#6B7280'];
const AGENTS={
  claude:{name:'Claude Code',prompt:'› '},
  gemini:{name:'Gemini CLI',prompt:'> '},
  codex:{name:'Codex',prompt:'❯ '}
};
const FILES=['src/service/OrderService.java','src/pages/order/index.vue','pom.xml','README.md','src/utils/date.ts','application.yml'];

let tags=[
  {id:'t1',name:'simba',color:'#2F6FDB'},
  {id:'t2',name:'iot',color:'#2A9D5C'},
  {id:'t3',name:'java',color:'#C98A0C'},
  {id:'t4',name:'前端',color:'#7B4FD1'},
  {id:'t5',name:'小程序',color:'#1E9BA8'},
  {id:'t6',name:'脚本',color:'#6B7280'}
];
const mk=(id,name,path,tg,extra={})=>Object.assign({id,name,path,tags:tg,agent:null,status:'idle',lines:[],timers:[],pending:''},extra);
let sessions=[
  mk('s1','simba-api','D:\\Projects\\simba\\api',['t1','t3'],{agent:'claude',status:'working'}),
  mk('s2','simba-admin','D:\\Projects\\simba\\admin-web',['t1','t4']),
  mk('s3','simba-mini','D:\\Projects\\simba\\miniapp',['t1','t5','t4'],{agent:'gemini',status:'blocked',pending:'npm test'}),
  mk('s4','iot-platform','D:\\Projects\\iot\\platform',['t2','t3'],{agent:'codex',status:'done'}),
  mk('s5','iot-gateway','D:\\Projects\\iot\\gateway',['t2','t3']),
  mk('s6','iot-console','D:\\Projects\\iot\\console-web',['t2','t4']),
  mk('s7','db-migrate','D:\\Tools\\migrate',['t6']),
  mk('s8','scratch','C:\\Users\\k\\scratch',[])
];

/* 预置一些终端内容，让首屏像在用的样子 */
function banner(agent,s){return[
  {t:'',c:''},
  {t:`  ✻ ${AGENTS[agent].name}    ${s.path}`,c:'cy'},
  {t:'  输入任务后回车；exit 退出回到 cmd',c:'dim'},
  {t:'',c:''}
];}
(function seed(){
  const s1=byId('s1');
  s1.lines.push({t:s1.path+'>claude',c:'in'},...banner('claude',s1),
    {t:'› 把 OrderService 里的状态流转改成枚举，补上单元测试',c:'in'},
    {t:'  正在分析代码…',c:'dim'});
  s1.pending='src/service/OrderService.java';
  const s3=byId('s3');
  s3.lines.push({t:s3.path+'>gemini',c:'in'},...banner('gemini',s3),
    {t:'> 洗鞋预约页在 iOS 上点击无响应，帮我查一下',c:'in'},
    {t:'  已定位到 pages/wash/index.vue 的 touch 事件绑定',c:'dim'},
    {t:'  Gemini CLI 想要运行 npm test，允许吗？(y/n)',c:'warn'});
  const s4=byId('s4');
  s4.lines.push({t:s4.path+'>codex',c:'in'},...banner('codex',s4),
    {t:'❯ 给设备上报接口加上限流',c:'in'},
    {t:'  ✓ 完成。改动已写入 src/main/java/iot/api/ReportController.java',c:'ok'});
})();

/* ---------- 状态 ---------- */
let filterTags=new Set(), filterMode='any', search='', collapsed=new Set();
let openTabs=['s1','s3'], activeId='s1', uid=100;
let popSession=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function byId(id){return sessions.find(s=>s.id===id)}
function tagById(id){return tags.find(t=>t.id===id)}
function tail(p){const a=p.split('\\').filter(Boolean);return a.slice(-2).join('\\')}
function later(s,ms,fn){const id=setTimeout(()=>{s.timers=s.timers.filter(x=>x!==id);fn();renderAll();},ms);s.timers.push(id);}
function clearTimers(s){s.timers.forEach(clearTimeout);s.timers=[];}
function push(s,t,c=''){s.lines.push({t,c});if(s.lines.length>400)s.lines.splice(0,s.lines.length-400);}
function finish(s){s.status=(s.id===activeId)?'idle':'done';}
function statusLabel(s){return {working:'运行中',blocked:'等待你',done:'已完成',idle:s.agent?'空闲（'+AGENTS[s.agent].name+'）':'空闲'}[s.status];}

/* ---------- 渲染 ---------- */
function renderAll(){renderChips();renderGroups();renderTabs();renderStrip();renderTerm();renderStatus();}

function tagCount(tid){return sessions.filter(s=>s.tags.includes(tid)).length}
function renderChips(){
  $('#tagChips').innerHTML=tags.length
    ? tags.map(t=>`<button class="chip ${filterTags.has(t.id)?'on':''}" style="--c:${t.color}" data-tid="${t.id}"><i></i>${esc(t.name)}<em>${tagCount(t.id)}</em></button>`).join('')
    : '<span class="hint">还没有标签，在"管理标签"里创建</span>';
  $('#modeAny').classList.toggle('on',filterMode==='any');
  $('#modeAll').classList.toggle('on',filterMode==='all');
  $('#clearFilter').style.visibility=filterTags.size?'visible':'hidden';
}

function visible(){
  const q=search.trim().toLowerCase();
  return sessions.filter(s=>{
    if(q&&!(s.name.toLowerCase().includes(q)||s.path.toLowerCase().includes(q)))return false;
    if(!filterTags.size)return true;
    const has=[...filterTags].map(t=>s.tags.includes(t));
    return filterMode==='any'?has.some(Boolean):has.every(Boolean);
  });
}
function buildGroups(){
  const vis=visible(), filtering=filterTags.size>0;
  const picked=tags.filter(t=>filterTags.has(t.id));
  if(filtering&&filterMode==='all'){
    return [{key:'all',title:picked.map(t=>t.name).join(' ∩ '),color:null,sessions:vis}];
  }
  const list=filtering?picked:tags;
  const gs=list.map(t=>({key:t.id,title:t.name,color:t.color,sessions:vis.filter(s=>s.tags.includes(t.id))}));
  if(!filtering){const un=vis.filter(s=>!s.tags.length);if(un.length)gs.push({key:'untagged',title:'未打标签',color:null,sessions:un});}
  return gs;
}
function rowHTML(s){
  const ts=s.tags.map(tagById).filter(Boolean);
  const tip=esc(s.path)+(ts.length>1?'&#10;同时在：'+ts.map(t=>esc(t.name)).join('、'):'');
  return `<button class="row ${s.id===activeId?'active':''}" data-sid="${s.id}" title="${tip}">
    <span class="dot ${s.status}"></span>
    <span class="txt"><div class="name">${esc(s.name)}</div><div class="path">${esc(tail(s.path))}</div></span>
    <span class="dots">${ts.map(t=>`<i style="background:${t.color}"></i>`).join('')}</span>
  </button>`;
}
function renderGroups(){
  const gs=buildGroups();
  const box=$('#groups');
  if(!gs.length||gs.every(g=>!g.sessions.length)){box.innerHTML='<div class="empty-side">没有匹配的会话。换个标签组合，或新建一个会话。</div>';return;}
  box.innerHTML=gs.map(g=>`
    <div class="group ${collapsed.has(g.key)?'':'open'}">
      <button class="group-h" data-g="${g.key}"><span class="tri"></span>${g.color?`<i style="--c:${g.color}"></i>`:''}<b>${esc(g.title)}</b><em>${g.sessions.length}</em></button>
      <div class="group-body">${g.sessions.map(rowHTML).join('')||'<div class="none">这个标签下还没有会话</div>'}</div>
    </div>`).join('');
}

function renderTabs(){
  $('#tabs').innerHTML=`<button class="tab-side" id="sideToggle" title="收起/展开左栏">☰</button>`+
    openTabs.map(id=>{const s=byId(id);if(!s)return'';return `<div class="tab ${id===activeId?'active':''}" data-tab="${id}" role="button" tabindex="0"><span class="dot ${s.status}"></span><span>${esc(s.name)}</span><button class="x" data-close="${id}" title="关闭标签页（会话继续在后台保持）">×</button></div>`;}).join('')+
    `<button class="tab-add" id="tabAdd" title="新建会话">＋</button>`;
}

function renderStrip(){
  const s=byId(activeId);
  $('#work').style.display=s?'flex':'none';
  $('#empty').style.display=s?'none':'grid';
  if(!s)return;
  const ts=s.tags.map(tagById).filter(Boolean);
  $('#strip').innerHTML=`
    <span class="path" title="会话固定在这个目录">${esc(s.path)}</span>
    <button class="btn sm" data-act="copy" title="复制路径">复制</button>
    ${ts.map(t=>`<span class="stag" style="--c:${t.color}">${esc(t.name)}<button data-untag="${t.id}" title="从这个标签移除">×</button></span>`).join('')}
    <button class="btn sm" data-act="addtag">+ 标签</button>
    <span class="launch">
      <span class="lab">${s.agent?'当前：'+AGENTS[s.agent].name+'，'+statusLabel(s):'唤起'}</span>
      ${s.agent
        ?`<button class="btn sm" data-cmd="exit">退出 ${AGENTS[s.agent].name}</button>`
        :Object.keys(AGENTS).map(a=>`<button class="btn sm mono" data-cmd="${a}">${a}</button>`).join('')}
      <button class="btn sm" data-cmd="cls">清屏</button>
      <button class="btn sm danger" data-act="remove">移除会话</button>
    </span>`;
}

function renderTerm(){
  const s=byId(activeId);if(!s)return;
  $('#termLines').innerHTML=s.lines.map(l=>`<div class="l ${l.c}">${esc(l.t)}</div>`).join('');
  $('#promptTxt').textContent=s.agent?AGENTS[s.agent].prompt:s.path+'>';
  const t=$('#term');t.scrollTop=t.scrollHeight;
}

function renderStatus(){
  const n=k=>sessions.filter(s=>s.status===k).length;
  $('#status').innerHTML=`<span>${sessions.length} 个会话</span>
    <span class="k"><span class="dot working"></span>${n('working')} 运行中</span>
    <span class="k"><span class="dot blocked" style="animation:none"></span>${n('blocked')} 等待你</span>
    <span class="k"><span class="dot done"></span>${n('done')} 已完成未查看</span>
    <span class="sp">原型：数据只在内存里，刷新即重置</span>`;
}

/* ---------- 会话操作 ---------- */
function selectSession(id){
  const s=byId(id);if(!s)return;
  if(s.status==='done')s.status='idle';
  activeId=id;
  if(!openTabs.includes(id))openTabs.push(id);
  renderAll();
  $('#termInput').focus();
}
function closeTab(id){
  const i=openTabs.indexOf(id);if(i<0)return;
  openTabs.splice(i,1);
  if(activeId===id)activeId=openTabs[Math.min(i,openTabs.length-1)]||null;
  renderAll();
}
function removeSession(id){
  const s=byId(id);if(!s)return;
  if(!confirm(`移除会话 "${s.name}"？终端进程会被结束。`))return;
  clearTimers(s);
  sessions=sessions.filter(x=>x.id!==id);
  openTabs=openTabs.filter(x=>x!==id);
  if(activeId===id)activeId=openTabs[0]||null;
  renderAll();
}
function createTag(name){
  name=name.trim();if(!name)return null;
  const ex=tags.find(t=>t.name===name);if(ex)return ex;
  const t={id:'t'+(uid++),name,color:TAG_COLORS[tags.length%TAG_COLORS.length]};
  tags.push(t);return t;
}
function pickFile(){return FILES[Math.floor(Math.random()*FILES.length)]}

/* ---------- 命令执行（模拟） ---------- */
function run(s,raw){
  const cmd=raw.trim();
  if(s.agent){
    const a=AGENTS[s.agent];
    push(s,a.prompt+raw,'in');
    if(/^(\/?exit|\/quit)$/i.test(cmd)){clearTimers(s);push(s,`已退出 ${a.name}，回到 cmd。`,'dim');s.agent=null;s.status='idle';return;}
    if(s.status==='blocked'){
      if(/^y(es)?$/i.test(cmd)){
        s.status='working';push(s,'  已允许，继续执行…','dim');
        later(s,1600,()=>{push(s,`  ✓ 完成。改动已写入 ${s.pending}`,'ok');finish(s);});
      }else{push(s,'  已拒绝，本轮结束。','warn');finish(s);}
      return;
    }
    if(!cmd)return;
    if(s.status==='working'){push(s,'  （上一条还在执行，稍等）','dim');return;}
    s.status='working';s.pending=pickFile();push(s,'  正在分析代码…','dim');
    later(s,1800,()=>{s.status='blocked';push(s,`  ${a.name} 想要编辑 ${s.pending}，允许吗？(y/n)`,'warn');});
    return;
  }
  push(s,s.path+'>'+raw,'in');
  const [name]=cmd.split(/\s+/);
  switch((name||'').toLowerCase()){
    case '':break;
    case 'cls':case 'clear':s.lines=[];break;
    case 'claude':case 'gemini':case 'codex':
      s.agent=name.toLowerCase();s.status='idle';s.lines.push(...banner(s.agent,s));break;
    case 'dir':
      push(s,' 驱动器 '+s.path[0]+' 中的卷是 Data');push(s,' '+s.path+' 的目录');push(s,'');
      push(s,'2026/09/10  09:12    <DIR>          .');push(s,'2026/09/10  09:12    <DIR>          src');
      push(s,'2026/09/08  18:40             1,204 pom.xml');push(s,'2026/09/01  10:03               312 README.md');
      push(s,'               2 个文件          1,516 字节');break;
    case 'cd':push(s,'原型里每个会话固定一个目录；要换目录，请新建会话。','dim');break;
    case 'help':
      push(s,'可用：claude / gemini / codex 唤起工具，dir 列目录，cls 清屏，help 帮助','dim');break;
    case 'exit':push(s,'会话由后台保持；关闭标签页不会结束它，移除会话才会。','dim');break;
    default:push(s,`'${name}' 不是内部或外部命令，也不是可运行的程序或批处理文件。`,'err');
  }
}

/* ---------- 事件 ---------- */
$('#search').addEventListener('input',e=>{search=e.target.value;renderGroups();});
$('#modeAny').onclick=()=>{filterMode='any';renderAll();};
$('#modeAll').onclick=()=>{filterMode='all';renderAll();};
$('#clearFilter').onclick=()=>{filterTags.clear();renderAll();};
$('#tagChips').addEventListener('click',e=>{
  const b=e.target.closest('[data-tid]');if(!b)return;
  const id=b.dataset.tid;filterTags.has(id)?filterTags.delete(id):filterTags.add(id);renderAll();
});
$('#groups').addEventListener('click',e=>{
  const g=e.target.closest('[data-g]');
  if(g){const k=g.dataset.g;collapsed.has(k)?collapsed.delete(k):collapsed.add(k);renderGroups();return;}
  const r=e.target.closest('[data-sid]');if(r)selectSession(r.dataset.sid);
});
$('#groups').addEventListener('mouseover',e=>{
  const r=e.target.closest('[data-sid]');if(!r)return;
  document.querySelectorAll(`.row[data-sid="${r.dataset.sid}"]`).forEach(x=>x.classList.add('peer'));
});
$('#groups').addEventListener('mouseout',e=>{
  const r=e.target.closest('[data-sid]');if(!r)return;
  document.querySelectorAll('.row.peer').forEach(x=>x.classList.remove('peer'));
});
$('#tabs').addEventListener('click',e=>{
  if(e.target.closest('#sideToggle')){$('#app').classList.toggle('side-hidden');return;}
  if(e.target.closest('#tabAdd')){openNewModal();return;}
  const x=e.target.closest('[data-close]');if(x){closeTab(x.dataset.close);return;}
  const t=e.target.closest('[data-tab]');if(t)selectSession(t.dataset.tab);
});
$('#tabs').addEventListener('keydown',e=>{const t=e.target.closest('[data-tab]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectSession(t.dataset.tab);}});
$('#strip').addEventListener('click',e=>{
  const s=byId(activeId);if(!s)return;
  const cmd=e.target.closest('[data-cmd]');
  if(cmd){run(s,cmd.dataset.cmd);renderAll();$('#termInput').focus();return;}
  const un=e.target.closest('[data-untag]');
  if(un){s.tags=s.tags.filter(t=>t!==un.dataset.untag);renderAll();return;}
  const act=e.target.closest('[data-act]');if(!act)return;
  if(act.dataset.act==='copy'){navigator.clipboard&&navigator.clipboard.writeText(s.path);act.textContent='已复制';setTimeout(()=>act.textContent='复制',1200);}
  if(act.dataset.act==='remove')removeSession(s.id);
  if(act.dataset.act==='addtag')openTagPop(act,s);
});
$('#term').addEventListener('click',e=>{if(!window.getSelection().toString())$('#termInput').focus();});
$('#termInput').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const s=byId(activeId);if(!s)return;
  run(s,e.target.value);e.target.value='';renderAll();
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();$('#search').select();}
  if(e.key==='Escape'){closeTagPop();$('#newModal').classList.remove('show');$('#tagsModal').classList.remove('show');}
});

/* 标签弹出层 */
function openTagPop(anchor,s){
  popSession=s;
  const pop=$('#tagPop');
  pop.innerHTML=tags.map(t=>`<button class="opt" style="--c:${t.color}" data-toggle="${t.id}"><i></i>${esc(t.name)}${s.tags.includes(t.id)?'<span class="ck">✓</span>':''}</button>`).join('')+
    `<input id="popNew" placeholder="新标签名，回车创建并加上">`;
  const r=anchor.getBoundingClientRect();
  pop.style.left=Math.min(r.left,window.innerWidth-240)+'px';pop.style.top=(r.bottom+6)+'px';
  pop.classList.add('show');
  $('#popNew').focus();
}
function closeTagPop(){$('#tagPop').classList.remove('show');popSession=null;}
$('#tagPop').addEventListener('click',e=>{
  const b=e.target.closest('[data-toggle]');if(!b||!popSession)return;
  const id=b.dataset.toggle,s=popSession;
  s.tags.includes(id)?(s.tags=s.tags.filter(t=>t!==id)):s.tags.push(id);
  renderAll();openTagPop($('#strip [data-act="addtag"]'),s);
});
$('#tagPop').addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.id!=='popNew')return;
  const t=createTag(e.target.value);if(!t)return;
  if(!popSession.tags.includes(t.id))popSession.tags.push(t.id);
  renderAll();openTagPop($('#strip [data-act="addtag"]'),popSession);
});
document.addEventListener('mousedown',e=>{
  if($('#tagPop').classList.contains('show')&&!e.target.closest('#tagPop')&&!e.target.closest('[data-act="addtag"]'))closeTagPop();
});

/* 新建会话 */
let nsTags=new Set();
function renderNsChips(){
  $('#nsChips').innerHTML=tags.map(t=>`<button class="chip ${nsTags.has(t.id)?'on':''}" style="--c:${t.color}" data-ns="${t.id}"><i></i>${esc(t.name)}</button>`).join('')||'<span class="hint">还没有标签</span>';
}
function openNewModal(){
  nsTags=new Set(filterTags);
  $('#nsName').value='';$('#nsPath').value='';$('#nsNewTag').value='';
  renderNsChips();$('#newModal').classList.add('show');$('#nsName').focus();
}
$('#newSessionBtn').onclick=openNewModal;
$('#nsCancel').onclick=()=>$('#newModal').classList.remove('show');
$('#nsChips').addEventListener('click',e=>{const b=e.target.closest('[data-ns]');if(!b)return;const id=b.dataset.ns;nsTags.has(id)?nsTags.delete(id):nsTags.add(id);renderNsChips();});
$('#nsNewTag').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=createTag(e.target.value);if(t){nsTags.add(t.id);e.target.value='';renderNsChips();renderChips();}});
$('#nsCreate').onclick=()=>{
  let name=$('#nsName').value.trim(),path=$('#nsPath').value.trim();
  if(!path){$('#nsPath').focus();$('#nsPath').placeholder='需要一个目录';return;}
  if(!name)name=path.split('\\').filter(Boolean).pop()||'新会话';
  const s=mk('s'+(uid++),name,path,[...nsTags]);
  sessions.push(s);$('#newModal').classList.remove('show');selectSession(s.id);
};
$('#newModal').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id!=='nsNewTag')$('#nsCreate').click();});

/* 管理标签 */
function renderTagRows(){
  $('#tagRows').innerHTML=tags.map(t=>`<div class="tagrow" style="--c:${t.color}">
    <button class="sw" data-color="${t.id}" title="换颜色"></button>
    <input value="${esc(t.name)}" data-rename="${t.id}">
    <em>${tagCount(t.id)} 个会话</em>
    <button class="btn sm danger" data-del="${t.id}">删除</button></div>`).join('')||'<div class="hint">还没有标签</div>';
}
$('#manageTagsBtn').onclick=()=>{renderTagRows();$('#tagsModal').classList.add('show');};
$('#mtClose').onclick=()=>{$('#tagsModal').classList.remove('show');renderAll();};
$('#tagRows').addEventListener('click',e=>{
  const c=e.target.closest('[data-color]');
  if(c){const t=tagById(c.dataset.color);t.color=TAG_COLORS[(TAG_COLORS.indexOf(t.color)+1)%TAG_COLORS.length];renderTagRows();return;}
  const d=e.target.closest('[data-del]');
  if(d){const t=tagById(d.dataset.del);if(!confirm(`删除标签 "${t.name}"？会话本身会保留。`))return;
    tags=tags.filter(x=>x.id!==t.id);sessions.forEach(s=>s.tags=s.tags.filter(x=>x!==t.id));filterTags.delete(t.id);renderTagRows();}
});
$('#tagRows').addEventListener('change',e=>{const i=e.target.closest('[data-rename]');if(!i)return;const t=tagById(i.dataset.rename);const v=i.value.trim();if(v)t.name=v;else i.value=t.name;});
$('#mtNewTag').addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(createTag(e.target.value)){e.target.value='';renderTagRows();}});
document.querySelectorAll('.backdrop').forEach(b=>b.addEventListener('mousedown',e=>{if(e.target===b)b.classList.remove('show');}));

/* ---------- 启动 ---------- */
renderAll();
later(byId('s1'),4000,()=>{const s=byId('s1');if(s.agent&&s.status==='working'){s.status='blocked';push(s,'  Claude Code 想要编辑 src/service/OrderService.java，允许吗？(y/n)','warn');}});
$('#termInput').focus();
</script>
