# pnpm 10+ 的设置文件：放行需要执行 install 脚本的依赖（electron 下载二进制、esbuild 下载平台包）
onlyBuiltDependencies:
  - electron
  - esbuild
  - node-pty

# app-builder-lib 26.15.3 声明 @electron/get ^3.0.0 但代码用到 3.1.0 才有的 ElectronDownloadCacheMode，
# pnpm 会给它解析到 3.0.0 导致打包时 "Cannot read properties of undefined (reading 'ReadWrite')"
overrides:
  'app-builder-lib>@electron/get': '3.1.0'
